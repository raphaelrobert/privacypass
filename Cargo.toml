[package]
name = "privacypass"
version = "0.2.0-pre.4"
edition = "2024"
description = "Implementation of Privacy Pass (RFC 9578)"
license = "MIT"
documentation = "https://docs.rs/privacypass"
repository = "https://github.com/raphaelrobert/privacypass"
readme = "README.md"
keywords = ["privacypass", "privacy", "pass", "ietf", "rfc9578"]
categories = ["cryptography", "authentication", "network-programming"]

[package.metadata.docs.rs]
features = ["deterministic-issuance"]

[dependencies]
async-trait = "0.1.92"
base64 = "0.23"
hybrid-array = "0.4.15"
rand = { version = "0.10", features = ["sys_rng"] }
log = { version = "0.4", features = ["kv"] }
serde = "1"
sha2 = "0.11.0"
subtle = "2"
thiserror = "2"
tls_codec = { version = "0.5.0", features = ["std", "derive"] }
voprf = { package = "voprf-ng", version = "=0.6.0", features = ["serde"] }
p384 = { version = "0.14.0", default-features = false, features = ["oprf"] }
blind-rsa-signatures = "0.18"
http = "1"
typenum = "1"
nom = "8"
tokio = { version = "1", features = ["full"], optional = true }
trait-variant = "0.1.3"

[features]
default = []
deterministic-issuance = ["voprf/danger"]
kat = ["deterministic-issuance"]
test-utils = ["tokio"]

[dev-dependencies]
privacypass = { path = ".", features = ["kat", "test-utils"] }
futures = "0.3"
criterion = { version = "0.8.2", features = ["async_futures", "async_tokio"] }
hex = { version = "0.4.3", features = ["serde"] }
serde_json = "1.0"

[[bench]]
name = "benchmark"
harness = false
